name: Observer evaluation job
description: Submit inert predictions for local maintainer checks and offline batch scoring.
title: "[observer job] "
body:
  - type: markdown
    attributes:
      value: |
        This form requests a data-only evaluation. Do not attach executable code,
        credentials, private model data, or evaluator targets. Opening this issue
        runs nothing. Monthly batches,
        scored within 30 days, with three submissions per person per task per
        30 days checked by hand. Attach predictions.csv and
        observer_card.json in a ZIP, or provide links at a specific commit.
        The maintainer computes file hashes on receipt.

  - type: dropdown
    id: task
    attributes:
      label: Task and version
      description: Results only compare within this exact task version.
      options:
        - safety-interlock-qwen2-5-7b-instruct@paired-scope-v1
    validations:
      required: true

  - type: input
    id: observer
    attributes:
      label: Observer name and version
      placeholder: my-observer@1.0.0
    validations:
      required: true

  - type: textarea
    id: predictions
    attributes:
      label: Prediction-table URL
      description: Attach the ZIP here or link files at a specific commit.
      placeholder: https://raw.githubusercontent.com/.../predictions.csv
    validations:
      required: true

  - type: textarea
    id: card
    attributes:
      label: ObserverCard JSON
      description: Paste the complete card, including access and cost fields.
      render: json
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Public validation scorecard and tuning
      description: Paste the complete CPU validation scorecard and describe any validation-based tuning.
    validations:
      required: true

  - type: checkboxes
    id: attestations
    attributes:
      label: Submission attestations
      options:
        - label: The linked artifact contains prediction data only and no executable code.
          required: true
        - label: I understand that access and provenance claims may be audited.
          required: true
        - label: I agree that accepted scores and the ObserverCard may be published.
          required: true

name: Submission preflight

on:
  pull_request:
    paths:
      - "submissions/pending/**"

permissions:
  contents: read

jobs:
  validate-data-only-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted validator from the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted

      - name: Check out only submitted data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: incoming
          sparse-checkout: submissions/pending
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate the submission as data
        run: |
          python trusted/scripts/validate_public_submission.py \
            --root incoming/submissions/pending \
            --output submission-preflight.json

      - name: Upload the preflight report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: submission-preflight
          path: submission-preflight.json
          if-no-files-found: error
